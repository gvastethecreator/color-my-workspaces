name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  media:
    name: Verify deterministic media
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:media

  build:
    name: Build release artifact
    needs: media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: pnpm run check:release -- --release
      - run: pnpm test
      - run: pnpm run check-types
      - run: pnpm run check:performance
      - run: xvfb-run -a pnpm run test:integration
      - run: xvfb-run -a pnpm run test:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: color-my-workspaces-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 90

  marketplace:
    name: Publish Visual Studio Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: color-my-workspaces-vsix
      - run: pnpm exec vsce publish --packagePath "$(find . -maxdepth 1 -name '*.vsix' -print -quit)" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  open-vsx:
    name: Publish Open VSX
    needs: build
    runs-on: ubuntu-latest
    environment: open-vsx
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: color-my-workspaces-vsix
      - run: pnpm exec ovsx publish "$(find . -maxdepth 1 -name '*.vsix' -print -quit)" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
